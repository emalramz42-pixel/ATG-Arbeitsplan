{% extends "base.html" %}
{% block title %}Chef-Login{% endblock %}

{% block content %}
    <div class="login-box">
        <h1>Chef-Login</h1>
        {% if fehler %}<p class="fehler">{{ fehler }}</p>{% endif %}
        <form method="post">
            <label for="passwort">Passwort</label>
            <input type="password" id="passwort" name="passwort" autofocus required>
            <button type="submit">Anmelden</button>
        </form>
    </div>
{% endblock %}
