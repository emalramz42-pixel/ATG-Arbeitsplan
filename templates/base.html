<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3e6e78">
    <title>{% block title %}ATG Arbeitsplan{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="manifest" href="{{ url_for('manifest') }}">
    <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Arbeitsplan">
</head>
<body>
    <header class="topbar">
        <a class="logo" href="{{ url_for('index') }}">
            <span class="logo-mark">ATG</span>
            <span class="logo-text">Arbeitsplan</span>
        </a>
        <nav>
            {% if is_admin %}
                <a href="{{ url_for('admin_woche') }}">Bearbeiten</a>
                <a href="{{ url_for('admin_logout') }}">Abmelden</a>
            {% else %}
                <a href="{{ url_for('admin_login') }}">Chef-Login</a>
            {% endif %}
        </nav>
    </header>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("{{ url_for('service_worker') }}");
            });
        }
    </script>
</body>
</html>
